services:
  sysctl-init:
    image: alpine:3.21
    container_name: sysctl-init
    privileged: true
    command: sysctl -w fs.aio-max-nr=1048576
    restart: "no"

  scylla-seed:
    image: scylladb/scylla:2026.1
    container_name: scylla-seed
    command: >
      --smp 2 --memory 1G --overprovisioned 1
      --listen-address 0.0.0.0
      --rpc-address 0.0.0.0
      --broadcast-address ${TEACHER_IP}
      --broadcast-rpc-address ${TEACHER_IP}
    mem_limit: 5G
    cpus: 2.0
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
    ports:
      - "7000:7000"
      - "9042:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", 'cqlsh -e "SELECT now() FROM system.local" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 256M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: migrate
    volumes:
      - ./migrations:/app/migrations
    environment:
      - SCYLLA_HOSTS=scylla-seed
      - SCYLLA_KEYSPACE=shortener
    depends_on:
      scylla-seed:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: url-shortener
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SCYLLA_HOSTS=scylla-seed
      - SCYLLA_KEYSPACE=shortener
      - SCYLLA_CONSISTENCY=${SCYLLA_CONSISTENCY:-QUORUM}
      - SCYLLA_DISABLE_INITIAL_HOST_LOOKUP=false
      - REDIS_ADDR=redis:6379
      - BASE_URL=http://${TEACHER_IP}:8000
      - PING_DATABASE_FREQUENCY_IN_MILLIS=10000
      - CACHE_DEFAULT_TTL_IN_MILLIS=3600000
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  krakend:
    image: krakend:${KRAKEND_VERSION:-2.13.8}
    container_name: krakend
    ports:
      - "8000:8080"
    volumes:
      - ./krakend:/etc/krakend
    environment:
      - FC_ENABLE=1
      - FC_SETTINGS=/etc/krakend/settings/prod
      - FC_PARTIALS=/etc/krakend/partials
      - FC_TEMPLATES=/etc/krakend/templates
      - FC_OUT=/tmp/krakend_out.json
    command: ["run", "-c", "/etc/krakend/krakend.tmpl.json"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  scylla_data:
