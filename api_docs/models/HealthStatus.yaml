type: object
description: Health check response
properties:
  status:
    type: string
    description: Overall service health status
    enum:
      - ok
      - degraded
    example: "ok"
  database:
    type: string
    description: Database connectivity status
    enum:
      - ok
      - error
    example: "ok"
  cache:
    type: string
    description: Cache connectivity status
    enum:
      - ok
      - error
    example: "ok"
